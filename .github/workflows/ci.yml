name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NOTE: no `cache: npm` — it requires a committed package-lock.json,
      # which needs `read:packages` locally to generate. Restore `cache: npm`
      # + `npm ci` once the lockfile lands.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Install dependencies (@logicinczo/dotkolam from GitHub Packages)
        run: npm install
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Typecheck + bundle
        run: npm run build

      - name: Harness law tests (P8)
        run: npm test

      - name: Bundle artifact exists
        run: test -s app/bundle.js && grep -q "bundle.js" app/index.html
