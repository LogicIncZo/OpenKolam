name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # @logicinczo/dotkolam resolves as a git dependency (public repo,
      # SHA-pinned in package.json) — no package-registry auth needed.
      - name: Install dependencies
        run: npm ci --no-audit

      - name: Typecheck + bundle
        run: npm run build

      - name: Harness law tests (P8)
        run: npm test

      - name: Bundle artifact exists
        run: test -s app/bundle.js && grep -q "bundle.js" app/index.html
